[workspace]
name = "what-to-eat-in-shou-today"
version = "0.1.0"
description = "今日海大吃什么项目"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
nodejs = ">=20,<27"
pnpm = ">=9,<11"

[tasks]
install = "pnpm --dir website install --frozen-lockfile"
dev = "pnpm --dir website start"
serve = "pnpm --dir website serve"
build = "pnpm --dir website build"
typecheck = "pnpm --dir website typecheck"
test = "pnpm --dir website test:e2e"
